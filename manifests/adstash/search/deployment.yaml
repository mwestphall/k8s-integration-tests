---
# Search-engine deployment for the adstash test suite. SEBackendKey (one of:
# es7, es8, es9, os2, os3) selects which image and version to deploy, along
# with the environment variables specific to that backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app: search
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: adstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
        app.kubernetes.io/name: search
        app.kubernetes.io/part-of: adstash
    spec:
      enableServiceLinks: false
      containers:
        - name: search
          image: {{ if hasPrefix "es" .SEBackendKey }}docker.elastic.co/elasticsearch/elasticsearch{{ else }}opensearchproject/opensearch{{ end }}:{{ .DBTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          env:
            - name: discovery.type
              value: single-node
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
            - name: action.destructive_requires_name
              value: "false"
{{- if eq .SEBackendKey "es7" }}
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.ml.enabled
              value: "false"
            - name: xpack.watcher.enabled
              value: "false"
            - name: xpack.graph.enabled
              value: "false"
            - name: stack.templates.enabled
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
            - name: cluster.deprecation_indexing.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
{{- else if or (eq .SEBackendKey "es8") (eq .SEBackendKey "es9") }}
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.ml.enabled
              value: "false"
            - name: xpack.watcher.enabled
              value: "false"
            - name: xpack.graph.enabled
              value: "false"
            - name: xpack.profiling.enabled
              value: "false"
            - name: stack.templates.enabled
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
            - name: cluster.deprecation_indexing.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
{{- else if eq .SEBackendKey "os2" }}
            - name: plugins.index_state_management.enabled
              value: "false"
            - name: plugins.index_state_management.history.enabled
              value: "false"
            - name: plugins.anomaly_detection.enabled
              value: "false"
            - name: plugins.alerting.alert_history_enabled
              value: "false"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI
              value: "true"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "NotUsed_SecurityDisabled1!"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
{{- else if eq .SEBackendKey "os3" }}
            - name: plugins.index_state_management.history.enabled
              value: "false"
            - name: plugins.anomaly_detection.enabled
              value: "false"
            - name: plugins.alerting.alert_history_enabled
              value: "false"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI
              value: "true"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "NotUsed_SecurityDisabled1!"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
{{- end }}
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: search-data
              mountPath: {{ if hasPrefix "es" .SEBackendKey }}/usr/share/elasticsearch/data{{ else }}/usr/share/opensearch/data{{ end }}
      volumes:
        # RAM-backed data directory.
        - name: search-data
          emptyDir:
            medium: Memory
