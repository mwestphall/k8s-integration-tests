name: Adstash Tests
on:
  workflow_call:
  workflow_dispatch:
jobs:
  test-adstash:
    name: Run Adstash tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - seBackendKey: es7
            dbTag: "7.17.23"
            runnerTag: es7py-os2py
            esPyVersion: "elasticsearch>=7,<8"
            osPyVersion: "opensearch-py>=2,<3"
          - seBackendKey: es8
            dbTag: "8.19.20"
            runnerTag: es8py-os2py
            esPyVersion: "elasticsearch>=8,<9"
            osPyVersion: "opensearch-py>=2,<3"
          - seBackendKey: os2
            dbTag: "2.19.4"
            runnerTag: es7py-os2py
            esPyVersion: "elasticsearch>=7,<8"
            osPyVersion: "opensearch-py>=2,<3"
          - seBackendKey: os3
            dbTag: "3.5.0"
            runnerTag: es7py-os3py
            esPyVersion: "elasticsearch>=7,<8"
            osPyVersion: "opensearch-py>=3,<4"
    uses: ./.github/workflows/test-harness.yaml
    with:
      testName: TestAdstash
      testEnv: |
        ADSTASH_SEBackendKey: ${{ matrix.seBackendKey }}
        ADSTASH_DBTag: ${{ matrix.dbTag }}
        ADSTASH_RunnerTag: ${{ matrix.runnerTag }}
        ADSTASH_ESPyVersion: ${{ matrix.esPyVersion }}
        ADSTASH_OSPyVersion: ${{ matrix.osPyVersion }}
